# Compact tmux profile for Termux. Start it with: tmux -f ~/.config/tmux/tmux.termux.conf
set -g mouse on
set -g history-limit 20000
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g status-position bottom
set -g status-interval 15
set -g status-style 'bg=default,fg=colour250'
set -g status-left '#[fg=colour39,bold] tmux #[fg=colour114]#S '
set -g status-left-length 28
set -g status-right '#[fg=colour245]#H  %H:%M '
set -g status-right-length 32
set -g window-status-format ' #I:#W '
set -g window-status-current-format '#[fg=default,bg=colour39,bold] #I:#W '
set -g pane-border-style 'fg=colour240'
set -g pane-active-border-style 'fg=colour39'

# Alt shortcuts work with hardware keyboards; the classic Ctrl-b shortcuts always work.
bind-key -n M-t new-window -c '#{pane_current_path}'
bind-key -n M-n split-window -v -c '#{pane_current_path}'
bind-key -n M-Enter split-window -h -c '#{pane_current_path}'
bind-key -n M-Left select-pane -L
bind-key -n M-Down select-pane -D
bind-key -n M-Up select-pane -U
bind-key -n M-Right select-pane -R
bind-key -n M-Space resize-pane -Z
bind-key -n M-c confirm-before -p 'Fechar painel? (y/n)' kill-pane
bind-key -n M-s choose-tree -Zw
set -g @menus_trigger 'Space'
set -g @menus_location_x 'C'
set -g @menus_location_y 'C'
set -g @menus_use_hint_overlays 'No'
set -g @menus_show_key_hints 'Yes'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @resurrect-capture-pane-contents 'on'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'jaclu/tmux-menus'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
run-shell -b '[ -f "$HOME/.tmux/plugins/tpm/tpm" ] && "$HOME/.tmux/plugins/tpm/tpm"'
